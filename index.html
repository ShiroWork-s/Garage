let fT=0;$('fin').addEventListener('click',()=>{if(state!=='play')return;const b=$('fin');if(!fT){b.textContent='TAP TO CONFIRM';fT=setTimeout(()=>{fT=0;b.textContent='FINISH RUN'},2500);return}clearTimeout(fT);fT=0;b.textContent='FINISH RUN';paused=false;$('pause').textContent='PAUSE';try{aud&&aud.resume()}catch(e){}end('RUN FINISHED')});
$('mn').addEventListener('click',()=>{$('over').classList.add('h');state='menu';reset();L=[];menu();$('start').classList.remove('h')});
document.querySelector('.tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(b){tab=+b.dataset.t;menu()}});
$('lst').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const k=b.dataset.k,p=+b.dataset.p;
 if(k==='rep'){const pc=Math.min(Math.ceil(sv.dmg||0),Math.floor(sv.money/6));if(pc<=0)return;sv.money-=pc*6;sv.dmg=Math.max(0,(sv.dmg||0)-pc);save();menu();return}
 if(k[0]==='u'){const u=k.slice(2);if(sv.up[u]<3&&sv.money>=p){sv.money-=p;sv.up[u]++}else return}
 else{if(!sv.own.includes(k)){if(sv.money<p){initAudio();beep(150,.2);return}sv.money-=p;sv.own.push(k)}if(k[0]==='c')sv.car=+k.slice(1);else if(k!=='bov'&&k!=='ic')sv.eng=k}
 let rsT=0;$('rs').addEventListener('click',()=>{const b=$('rs');if(!rsT){b.textContent='TAP AGAIN TO ERASE EVERYTHING';rsT=setTimeout(()=>{rsT=0;b.textContent='RESET PROGRESS'},3000);return}clearTimeout(rsT);rsT=0;b.textContent='RESET PROGRESS';sv={money:250,own:['c0','na'],car:0,eng:'na',tank:0,up:{tank:0,tire:0,arm:0,tune:0,lock:0},trans:'A',v2:1,v3:1,cp:0,dmg:0};best=0;try{localStorage.removeItem('shiro_best')}catch(e){}$('best').textContent=0;tab=0;save();menu()});
save();menu()});
menu();
$('pause').addEventListener('click',()=>{if(state!=='play')return;paused=!paused;try{aud&&(paused?aud.suspend():aud.resume())}catch(e){}$('pause').textContent=paused?'RESUME':'PAUSE'});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play'){paused=true;$('pause').textContent='RESUME'}});
document.addEventListener('touchmove',e=>{if(!e.target.closest('#lst'))e.preventDefault()},{passive:false});
})();
</script></body></html>
